[[plugins]]
  package = "@netlify/plugin-nextjs"

[build]
  publish = ".next"
  command = "npm run build"
# Refund webhook: purchases at or after this moment were made under the
# privacy policy that discloses refund-time usage sharing with Apple.
# Set to the moment the policy page says so; never earlier.
[context.production.environment]
  # Set automatically the moment the privacy page publishes the refund paragraph.
  REFUND_CONSENT_EFFECTIVE_DATE = "2026-09-25T19:09:03Z"
